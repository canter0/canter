name: ci

on:
  pull_request:
  push:
    branches: [main]

# Verify the PR's merge candidate once per update. Keep each main commit's
# release-eligible run independent from PR runs and other main commits.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m unittest discover -s scripts -p 'test_canter_ci_*.py'
      - run: bash -n scripts/canter-ci-public-benchmark.sh

  sdks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --prefix sdk/typescript --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix sdk/typescript
      - run: npm pack --dry-run
        working-directory: sdk/typescript
      - run: python3 -m unittest discover -s sdk/python/tests -v
        env:
          PYTHONPATH: sdk/python
      - run: python3 -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/canter-sdk-wheels" ./sdk/python

  go-suites:
    name: Go ${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: standard
            test_flags: ""
          - mode: race
            test_flags: "-race"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Docker's official distribution avoids shared-runner Docker Hub limits.
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      CANTER_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci --prefix harness --ignore-scripts --no-audit --no-fund
      - if: matrix.mode == 'standard'
        run: npm test --prefix harness
      - run: go test ${{ matrix.test_flags }} -timeout 30m ./...
      - if: matrix.mode == 'standard'
        run: |
          set -euo pipefail
          go vet ./...
          python3 deploy/test_pull_release.py
          python3 scripts/test_production_status.py
          test -z "$(find . -name '*.go' -not -path './web/node_modules/*' -print0 | xargs -0 gofmt -l)"

  # Branch protection requires the existing "go" check. A skipped, failed,
  # or canceled suite cannot turn that check green.
  go:
    needs: go-suites
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both Go suites
        env:
          GO_SUITES_RESULT: ${{ needs.go-suites.result }}
        run: |
          if [ "$GO_SUITES_RESULT" != success ]; then
            echo "::error::The required Go suites ended with $GO_SUITES_RESULT"
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: pnpm build
