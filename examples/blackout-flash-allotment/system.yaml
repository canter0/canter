apiVersion: canter.dev/v1alpha1
kind: System
metadata:
  name: flash-allotment
spec:
  intent: Keep a neighborhood emergency-supply allotment service available with private durable PostgreSQL state.
  constraints:
    host:
      class: c1
      count: 1
      memoryMiB: 1024
      systemReserveMiB: 384
  services:
    - name: database
      kind: database
      engine: postgres
      isolation: process
      instances: 1
      resources:
        vcpu: 1
        memoryMiB: 384
      readiness:
        protocol: tcp
        port: 5432
      networking: private
    - name: web
      kind: service
      engine: http
      isolation: process
      instances: 1
      dependsOn:
        - database
      resources:
        vcpu: 1
        memoryMiB: 192
      readiness:
        protocol: http
        port: 8080
      networking: public
  m1:
    prefix: systems/flash-allotment
